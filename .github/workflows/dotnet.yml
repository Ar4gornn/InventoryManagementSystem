name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore InventoryManagementSystem.sln

      - name: Build
        run: dotnet build InventoryManagementSystem.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test InventoryManagementSystem.sln --no-build --configuration Release --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # tsc runs as part of the build script, but running it alone first means a
      # type error is reported as a type error rather than a bundling failure.
      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build
