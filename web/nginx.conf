server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames change whenever their content does, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a browser keeps loading the old bundle
    # after a deploy and requests asset filenames that no longer exist.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
